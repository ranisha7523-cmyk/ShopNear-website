<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist - ShopNear</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- Main Header & Sub-Category Nav rendered by shared.js -->
  <div id="mainHeader"></div>

  <!-- Wishlist Main Section -->
  <main class="main-wrapper">
    <div style="max-width: 1000px; margin: 0 auto;">
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 16px;">My Wishlist (<span id="wishlistCount">0</span>)</h2>
      
      <div id="wishlistContainer" style="display: flex; flex-direction: column; gap: 16px;">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Footer rendered by shared.js -->
  <div id="mainFooter"></div>

  <!-- Scripts -->
  <script src="products-data.js"></script>
  <script src="shared.js"></script>

  <script>
    function removeWishlistItem(productId) {
      let wishlist = getWishlist();
      wishlist = wishlist.filter(id => id !== productId);
      saveWishlist(wishlist);
      showToast("Removed from wishlist");
      renderWishlistPage();
    }

    function moveWishlistToCart(productId) {
      addToCart(productId, 1);
      removeWishlistItem(productId);
    }

    function renderWishlistPage() {
      const container = document.getElementById("wishlistContainer");
      const countSpan = document.getElementById("wishlistCount");
      const wishlist = getWishlist();

      countSpan.textContent = wishlist.length;

      if (wishlist.length === 0) {
        container.innerHTML = `
          <div style="background:var(--card-bg); border-radius:4px; padding:48px; text-align:center; box-shadow:var(--shadow-sm);">
            <i class="fa-regular fa-heart" style="font-size:64px; color:var(--border-color); margin-bottom:16px"></i>
            <h3 style="font-size:20px; font-weight:700">Empty Wishlist</h3>
            <p style="color:var(--text-secondary); margin-top:6px">You have no items in your wishlist. Start adding!</p>
            <a href="shop.html" class="place-order-btn" style="display:inline-block; width:auto; padding:12px 36px; margin-top:20px; background:var(--primary-blue)">EXPLORE PRODUCTS</a>
          </div>
        `;
        return;
      }

      container.innerHTML = wishlist.map(id => {
        const product = PRODUCTS.find(p => p.id === id);
        if (!product) return '';

        return `
          <div style="background:var(--card-bg); border-radius:4px; box-shadow:var(--shadow-sm); padding:16px; display:flex; gap:20px; align-items:center; position:relative;">
            
            <button onclick="removeWishlistItem('${product.id}')" style="position:absolute; top:16px; right:16px; background:none; color:var(--text-secondary); font-size:18px; cursor:pointer;" title="Remove">
              <i class="fa-solid fa-trash-can"></i>
            </button>

            <img src="${product.image}" alt="${product.name}" style="width:100px; height:100px; object-fit:contain; cursor:pointer" onclick="window.location.href='product-detail.html?id=${product.id}'">
            
            <div style="flex:1">
              <div style="font-size:16px; font-weight:600; cursor:pointer" onclick="window.location.href='product-detail.html?id=${product.id}'">${product.name}</div>
              
              <div class="rating-row" style="margin-top:6px; margin-bottom:8px">
                <span class="rating-badge">${product.rating} <i class="fa-solid fa-star" style="font-size:10px"></i></span>
                <span class="rating-count">(${product.ratingCount.toLocaleString()})</span>
                ${product.isAssured ? `<span class="verified-badge"><i class="fa-solid fa-circle-check"></i> Verified</span>` : ''}
              </div>

              <div class="price-row" style="padding-top:0">
                <span class="current-price" style="font-size:18px">${formatPrice(product.price)}</span>
                <span class="original-price" style="font-size:14px">${formatPrice(product.originalPrice)}</span>
                <span class="discount-tag" style="font-size:14px">${product.discount}% off</span>
              </div>
            </div>

            <button onclick="moveWishlistToCart('${product.id}')" class="add-cart-btn" style="width:auto; padding:10px 24px; font-size:14px">
              <i class="fa-solid fa-cart-plus"></i> ADD TO CART
            </button>

          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderWishlistPage);
  </script>
</body>
</html>
